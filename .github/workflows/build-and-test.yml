name: Running the python script
on:
  push:
    branches:
      - main

jobs:
  build-and-test-Autonmated-Python-code:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v4
      - name: Running the python disk analyzer script
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: print working directory
        run: pwd
      - name: list files in the directory
        run: ls -la
      - name: verify Python version
        run: python --version
      - name: run recent file modified script
        run:  python recent_file_modified.py .
      - name: run date until date script
        run: python days_until_date.py 2026-12-31
      - name: install the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil
      - name: run uptime python script
        run: python uptime.py
      - name: run free_disk.py
        run: python free_disk.py .
      - name: Run counting files and directories
        run: python count_disk_and_files.py